name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. GITHUB_TOKEN defaults to a broad, write-capable scope on some
# repository settings; declaring it here means every job in this file gets
# read-only access to contents and nothing else, regardless of that default.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Matches docker-compose.yml so local and CI runs use the same URL shape.
  DATABASE_URL: postgres://tenantless:tenantless_dev@localhost:5433/tenantless

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenantless
          POSTGRES_PASSWORD: tenantless_dev
          POSTGRES_DB: tenantless
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tenantless"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Provision schema
        run: uv run tenantless init-db

      - name: Unit + contract suite
        run: uv run pytest -q

  e2e:
    name: End-to-end (generate → serve → scan)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenantless
          POSTGRES_PASSWORD: tenantless_dev
          POSTGRES_DB: tenantless
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tenantless"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: uv sync --dev

      # The server embeds the built console, so the SPA has to exist before the
      # Rust build. Without this the integration test skips instead of running,
      # which would make this job a green no-op.
      - name: Build web console
        run: cd frontend && npm ci && npm run build

      - name: Build server
        run: cargo build --release -p tenantless-server --bin tenantless-server

      # The two integration tests TRUNCATE + rewrite the synthetic schema, so they self-skip
      # unless explicitly allowed. This is a throwaway CI Postgres, so allow it — otherwise the
      # job would "pass" having run nothing.
      - name: Integration suite (must actually run, not skip)
        env:
          TENANTLESS_E2E_ALLOW_TRUNCATE: "1"
        run: |
          uv run pytest -q -m integration -rs 2>&1 | tee /tmp/e2e.log
          # Non-vacuity floor: the intended population is 2 integration tests. If the server
          # binary or Postgres were missing they would skip and the suite would exit 0 having
          # run nothing — assert that at least 2 actually PASSED. An optional-dependency skip
          # (e.g. the azure SDK) does not lower this count.
          passed=$(grep -oE '[0-9]+ passed' /tmp/e2e.log | tail -1 | grep -oE '[0-9]+')
          passed=${passed:-0}
          if [ "$passed" -lt 2 ]; then
            echo "::error::integration suite ran only $passed of the 2 intended tests — the population did not actually run (server binary or Postgres missing?)"
            exit 1
          fi

  privacy-gates:
    name: Privacy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # These are the gates that must never be allowed to rot. They are split into
      # their own job so a failure here is unambiguous in the checks list, and so it
      # runs even when the matrix above is still going.
      #
      # NOTE: the scrub gate runs here with the COMMITTED generic token set only --
      # tests/.scrub-tokens.private.json is gitignored and absent on a public runner
      # by design. Maintainers run the private supplement locally before a release.
      - name: Scrub gate
        run: uv run pytest tests/test_scrub_gate.py -q

      - name: Data-boundary leak tests
        run: uv run pytest tests/test_azure_leak.py tests/test_cost_leak.py -q

      - name: Profile provenance gate
        run: |
          uv run pytest tests/test_profile_provenance.py -q
          uv run python scripts/check_release_provenance.py --tree .

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # mock-server/build.rs panics if frontend/dist is absent (the server embeds the built
      # SPA via include_dir!). `clippy --all-targets` compiles that build script, so the
      # console must be built before fmt/clippy/test here too — not only in the e2e job.
      - name: Build web console (required by the build.rs embed)
        run: cd frontend && npm ci && npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # testcontainers starts its own ephemeral Postgres; the ubuntu runner has a
      # working Docker daemon, so no service container is needed here. Cap concurrency so a
      # burst of per-test containers doesn't overwhelm the daemon (StartupTimeout).
      - name: Test
        run: cargo test -p tenantless-server -- --test-threads=4

  frontend:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build only -- nothing is pushed from CI.
      - name: Build mock-server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: mock-server/Dockerfile
          push: false
          load: true
          tags: tenantless-mock-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm tenantless-mock-server:ci --help

      - name: Assert the image runs as a non-root user
        run: |
          # `--entrypoint id` overrides the server ENTRYPOINT so `id -u` reports the
          # image's configured runtime UID (the Dockerfile `USER` directive). A root
          # image prints 0 and fails here; the non-root runtime prints 10001.
          uid="$(docker run --rm --entrypoint id tenantless-mock-server:ci -u)"
          echo "runtime uid=$uid"
          test "$uid" != "0"
