name: Pages

# Publishes the project site (landing.html and its images) to GitHub Pages.
# Only the page and docs/assets/site are uploaded; nothing else in the repository
# is served.
on:
  push:
    branches: [main]
    paths:
      - landing.html
      - docs/assets/site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the site
        run: |
          mkdir -p _site/docs/assets/site
          cp landing.html _site/index.html
          cp docs/assets/site/* _site/docs/assets/site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
