version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Major bumps are intentionally NOT auto-proposed for cargo: the dep-digest
    # workflow (.github/workflows/dep-digest.yml) surfaces them monthly and they are
    # taken by hand. For 0.x crates Dependabot classifies a minor bump (e.g. 0.6 -> 0.7)
    # as semver-major, so 0.x breaking bumps are held too. rand's major in particular
    # must stay held until rsa 0.10 ships: rsa 0.9 pins rand_core 0.6 (the OsRng used for
    # RS256 keygen in mock-server/src/jwt.rs) and rand 0.10 drops rand::rngs::OsRng.
    # Security fixes still flow via Dependabot security updates, which are enabled and
    # are not governed by this rule. Minor/patch updates still arrive grouped below.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Group only minor + patch bumps into one PR; major bumps come as their own
      # individual PRs so a breaking major can't block a batch of safe updates.
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Majors are surfaced monthly by the dep-digest workflow and taken by hand;
    # security fixes still flow via Dependabot security updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/mock-server"
    schedule:
      interval: monthly
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
