[package]
name = "tenantless-server"
version = "1.6.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "request-id"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64 = "0.22"
# RS256 JWT mint/decode + JWKS export (IAM-04, D-08). jsonwebtoken is used for
# `Jwk::from_encoding_key` (JWKS straight from the signing key) + `use_pem`
# (EncodingKey/DecodingKey::from_rsa_pem). The ephemeral RSA-2048 keypair is
# generated by the pure-Rust `rsa` crate (NOT rcgen — rcgen RSA needs the aws-lc-rs
# backend, a second crypto provider Phase-8 D-16 deliberately avoided by pinning
# `ring`). rsa 0.10 fixes RUSTSEC-2023-0071 ("Marvin"), so no cargo-audit exception
# is needed for it any more. jsonwebtoken 12 moves the RustCrypto graph to
# elliptic-curve 0.14 / crypto-bigint 0.7, which fixes RUSTSEC-2026-0387.
# `rust_crypto` selects jsonwebtoken's RustCrypto provider (NOT `aws_lc_rs`) — keeps
# this in the same pure-Rust crypto family as the `rsa` keygen and avoids the
# aws-lc-rs/cmake build chain + the second-provider concern (Phase-8 D-16).
# jsonwebtoken requires exactly one provider feature or it panics at JWK use.
jsonwebtoken = { version = "12", features = ["use_pem", "rust_crypto"] }
rsa = "0.10"
# OS randomness for the RSA keygen: getrandom's `SysRng` implements the rand_core 0.10
# `TryCryptoRng` bound that rsa 0.10's `PrivateKey::new` requires. getrandom 0.4 is
# already in Cargo.lock via the rsa / crypto-bigint graph.
getrandom = { version = "0.4", features = ["sys_rng"] }
# TLS (PLAT-05, D-15/D-16): one rustls stack pinned to the `ring` provider so it
# matches sqlx's `runtime-tokio-rustls` (also `ring`) — avoids a second crypto
# provider (aws-lc-rs) and its cmake/aws-lc-sys build chain, and avoids the
# ambiguous-provider runtime panic. rustls default features are disabled to drop
# `aws-lc-rs`; `ring` + `tls12` + `logging` are re-enabled explicitly.
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
rcgen = "0.14"
# Web Console SPA embed (WEBUI-03, D-06): `include_dir` embeds the built `frontend/dist`
# tree into the binary at COMPILE time (multi-file, hash-named Vite assets — `include_str!`
# per file does not generalize); `mime_guess` supplies the correct Content-Type per asset
# extension (.js/.css/.woff2) so the browser accepts the module scripts (Pitfall 5). Both
# exact-pinned + crates.io-verified (RESEARCH: 57M / 225M downloads). The freshness guard
# lives in build.rs (`cargo:rerun-if-changed=../frontend/dist` + missing-dist hard error).
include_dir = "0.7.4"
mime_guess = "2.0.5"
# Control-plane constant-time token compare (Phase 17, CTRL-05 / T-17-03). BOTH are
# ALREADY in Cargo.lock (subtle 2.6.1 / sha2 0.10.9) via the rustls/RustCrypto graph, so
# promoting them to DIRECT deps adds ZERO new lock entries (mirrors the jsonwebtoken
# dev-dep note below — nothing new for `cargo audit`). `subtle::ConstantTimeEq` compares
# the two SHA-256 token digests without a length/early-exit timing leak; `sha2` produces
# the fixed 32-byte digest the compare runs over. Never hand-roll the compare.
subtle = "2.6"
sha2 = "0.10"
# Execution-budget middleware (resource-exhaustion guards): the request-timeout + shared
# concurrency-limit + load-shed layers that `lib.rs::apply_execution_budgets` wraps the
# router in. `tower` is ALREADY in Cargo.lock (transitive via axum / tower-http), so
# promoting it to a DIRECT dep adds ZERO new lock entries — it only enables the
# `timeout`/`limit`/`load-shed` layers (plus `util`, which the integration tests' `oneshot`
# driver also uses). Pinned to the 0.5 line already resolved.
tower = { version = "0.5", features = ["util", "limit", "load-shed", "timeout"] }
# `Limited` body reader + its `LengthLimitError` for the cost body-size extractor: bounds a
# chunked / unknown-Content-Length body WHILE streaming and lets the extractor tell a
# size-budget rejection (413) apart from any other body-stream failure (500). ALREADY in
# Cargo.lock (transitive via axum), so this direct dep adds ZERO new lock entries — same
# rationale as `tower`/`subtle`/`sha2` above.
http-body-util = "0.1"
# Lowercase 64-char hex encode of the SHA-256 digest for the baseline `b-` ETag domain.
# hex 0.4.3 is ALREADY in Cargo.lock transitively (RustCrypto
# /utils ecosystem), so promoting it to a DIRECT dep adds ZERO new lock entries — same
# rationale as the `subtle`/`sha2` promotion above. Never hand-roll the nibble loop.
hex = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Same jsonwebtoken already in [dependencies] (no new crate / lock entry) — exposed to
# the integration-test crate so it can independently decode a minted token against the
# served JWKS (token_decodable_via_jwks) and craft expired/wrong-aud/wrong-iss/HS256
# tokens for the enforce_auth_roundtrip round-trip (Plan 10-04).
jsonwebtoken = { version = "12", features = ["use_pem", "rust_crypto"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio-test = "0.4"
