services:
  # Synthetic data Postgres -- isolated on port 5433 to avoid host Postgres conflicts
  postgres-sim:
    image: postgres:16-alpine
    # No container_name (Wave2 #3): a fixed name defeats Compose project-name
    # isolation, so two clones / test runs / users cannot run concurrently.
    env_file: .env
    ports:
      # D-12 hardening: bind the host mapping to loopback only (was `5433:5432`,
      # i.e. all interfaces). Reachable from the dev box (and a 127.0.0.1 Path-A
      # scan / host `generate`), NOT from the wider network. Container<->container
      # traffic is unaffected — it stays on the `postgres-sim` service name at :5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - sim-pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      # Wave2 #2: honor a changed POSTGRES_USER — read it from the container's runtime
      # env (env_file: .env) rather than hardcoding `tenantless`. `$$` escapes Compose
      # interpolation so the shell in the container expands it.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tenantless}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ARM mock server -- the real tenantless-server Rust binary (INFRA-01: port 8080).
  mock-server:
    build:
      context: .
      dockerfile: mock-server/Dockerfile
    image: tenantless-mock-server
    # No container_name (Wave2 #3): keep Compose project-name isolation.
    # Explicit env (NOT env_file: .env, whose DATABASE_URL points at localhost:5433 —
    # wrong inside the compose network). Reach Postgres by service name on 5432, but
    # honor the SAME POSTGRES_USER/PASSWORD/DB as postgres-sim (Wave2 #2) — Compose
    # substitutes these from the auto-loaded .env, defaulting to the dev values.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tenantless}:${POSTGRES_PASSWORD:-tenantless_dev}@postgres-sim:5432/${POSTGRES_DB:-tenantless}
      BASE_URL: http://localhost:8080
      PORT: "8080"
      # SEC-HIGH-3: the server defaults to a 127.0.0.1 bind, which is unreachable
      # from outside the container. Inside the image it MUST bind 0.0.0.0 so the
      # published port works; the host mapping below restricts exposure to loopback.
      HOST: 0.0.0.0
    ports:
      # Publish on the host loopback only (SEC-HIGH-3): reachable from the dev box
      # (and a localhost Path-A scan), not from the wider network.
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Any token is accepted; an empty synthetic DB still returns 200 {"value":[]}.
      test: ["CMD", "curl", "-fsS", "-H", "Authorization: Bearer health", "http://localhost:8080/subscriptions"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres-sim:
        condition: service_healthy
      # D-04: with `--profile demo` the one-shot generator seeds the estate first;
      # mock-server waits for it to COMPLETE SUCCESSFULLY. `required: false` means
      # plain `docker compose up` (no --profile demo, generator absent) is UNCHANGED —
      # mock-server does not demand the generator and still serves an empty tenant.
      generator:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped

  # One-shot synthetic-data generator (D-04/D-06). Only present under the `demo`
  # compose profile; seeds the estate then exits. The D-05 non-empty guard in the
  # entrypoint SKIPS generation on a populated volume, so it never clobbers data.
  generator:
    build:
      context: .
      dockerfile: generator.Dockerfile
    image: tenantless-generator
    # No container_name (Wave2 #3): keep Compose project-name isolation.
    # Compose profile `demo` (D-04) — distinct namespace from the generation
    # `--profile demo` alias the entrypoint passes to `tenantless generate`.
    profiles: ["demo"]
    environment:
      # Reach Postgres by SERVICE NAME on 5432 (container<->container), never the
      # host localhost:5433 mapping. Honor the SAME credentials as postgres-sim
      # (Wave2 #2) — substituted from the auto-loaded .env, dev values as defaults.
      DATABASE_URL: postgres://${POSTGRES_USER:-tenantless}:${POSTGRES_PASSWORD:-tenantless_dev}@postgres-sim:5432/${POSTGRES_DB:-tenantless}
    depends_on:
      postgres-sim:
        condition: service_healthy
    # One-shot: run once to completion, do not restart.
    restart: "no"

volumes:
  sim-pgdata:
