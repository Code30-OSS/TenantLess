# cargo-audit configuration.
#
# Every entry in `ignore` below is a deliberate, narrowly scoped exception with a
# written rationale. An advisory is ignored only when the vulnerable code is provably
# absent from what this codebase builds or runs: either no patched release exists and
# the vulnerable operation is one this codebase does not perform, or the crate sits in
# Cargo.lock without ever being compiled and the fix is out of reach of the pinned
# stack. An advisory that merely looks inconvenient does not qualify — if a fix is
# reachable, take the fix.
#
# Lockfile-only crates: sqlx 0.8 lists its MySQL and SQLite drivers as optional
# dependencies, so Cargo.lock records them even though Tenantless enables only the
# `postgres` driver. `cargo tree -i <crate> --target all -e all` prints nothing for
# them: they are not compiled into the server, the tests, or any other target. The
# entries below that rely on this must be re-checked with that command whenever the
# sqlx features change, and dropped once sqlx 0.9 is adopted.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack: potential key recovery through timing
    # sidechannels" in `rsa` 0.9.x.
    #
    # The code Tenantless builds uses `rsa` 0.10, which fixes this (the mock server
    # and `jsonwebtoken` 12 both resolve to 0.10). `rsa` 0.9.10 remains in Cargo.lock
    # only as a dependency of `sqlx-mysql`, a lockfile-only driver (see above); it is
    # never compiled. Moving it to 0.10 needs sqlx 0.9, which the project does not
    # adopt yet.
    #
    # Revisit when sqlx 0.9 is adopted, or if the `mysql` sqlx feature is enabled.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0459 — `libsqlite3-sys` bundles a C SQLite affected by
    # CVE-2026-119375.
    #
    # The fix is `libsqlite3-sys` 0.39, but sqlx 0.8.6 requires 0.30, so the fix is
    # out of reach without sqlx 0.9. `libsqlite3-sys` is a dependency of
    # `sqlx-sqlite`, a lockfile-only driver (see above): no SQLite code is compiled
    # or linked into any Tenantless build, and Tenantless never opens a SQLite
    # database.
    #
    # Revisit when sqlx 0.9 is adopted, or if the `sqlite` sqlx feature is enabled.
    "RUSTSEC-2026-0459",
]
